name: Smoke test

on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/**'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/**'
      - 'package.json'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
